<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#bfe9ff">
<title>Bubble Garden</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&family=Noto+Nastaliq+Urdu:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root { --ink: #2b2d42; --card: #ffffffe0; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: "Nunito", ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", sans-serif;
    color: var(--ink);
    background: linear-gradient(180deg, #bfe9ff 0%, #e6f7ff 55%, #fff4d6 100%);
    user-select: none; -webkit-user-select: none;
    touch-action: none; -webkit-tap-highlight-color: transparent;
  }
  body.kids { background: linear-gradient(180deg, #e5dbff 0%, #f3f0ff 50%, #d3f9d8 100%); }
  :root[lang="ur"] body { font-family: "Nunito", "Noto Nastaliq Urdu", serif; }
  :root[lang="ur"] small, :root[lang="ur"] .hint, :root[lang="ur"] #menu p { line-height: 2.1; }
  :root[lang="ur"] h2 { line-height: 1.7; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }

  /* ---------- Menu ---------- */
  #menu {
    position: fixed; inset: 0; z-index: 5;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: clamp(14px, 3vh, 28px); padding: 24px 16px; text-align: center;
  }
  #menu.hide { display: none; }
  #menu h1 { font-size: clamp(42px, 8vw, 76px); font-weight: 900; letter-spacing: -1px; line-height: 1; }
  #menu p { font-size: clamp(18px, 2.6vw, 24px); opacity: .8; font-weight: 600; }
  .cards { display: flex; flex-wrap: wrap; gap: 18px; justify-content: center; max-width: 920px; }
  .card {
    appearance: none; border: 0; border-radius: 28px; background: var(--card); color: var(--ink);
    box-shadow: 0 10px 30px #0000001f; padding: 22px 24px; width: min(290px, 88vw);
    cursor: pointer; font: inherit; display: flex; flex-direction: column; align-items: center; gap: 6px;
    transition: transform .15s ease;
  }
  .card:hover, .card:focus-visible { transform: translateY(-4px) scale(1.02); outline: none; box-shadow: 0 14px 36px #00000029; }
  .card:active { transform: scale(.97); }
  .card .emoji { font-size: 58px; line-height: 1.1; }
  .card b { font-size: 27px; font-weight: 900; }
  .card small { font-size: 17px; opacity: .75; line-height: 1.3; font-weight: 600; }
  @media (max-height: 620px) {
    .card { flex-direction: row; padding: 14px 20px; gap: 14px; text-align: start; }
    .card .emoji { font-size: 40px; }
    .card small { display: none; }
  }
  #langBtn { position: fixed; top: max(14px, env(safe-area-inset-top)); inset-inline-end: 16px; z-index: 6; }
  body.toddler #langBtn, body.kids #langBtn { display: none; }

  /* ---------- HUD ---------- */
  #hud {
    position: fixed; top: 0; left: 0; right: 0; z-index: 4;
    display: none; justify-content: space-between; align-items: flex-start;
    padding: max(14px, env(safe-area-inset-top)) 16px 0; pointer-events: none;
  }
  #hud.show { display: flex; }
  #hud > * { pointer-events: auto; }
  .hbtn {
    width: 62px; height: 62px; border-radius: 50%; border: 0; cursor: pointer;
    background: #ffffffcc; color: var(--ink); font-size: 28px; line-height: 1;
    box-shadow: 0 4px 14px #0000001a; position: relative; overflow: hidden;
    display: grid; place-items: center; font-family: inherit;
  }
  .hbtn .fill { position: absolute; left: 0; bottom: 0; width: 100%; height: 0; background: #ff8fab99; }
  .hbtn.holding .fill { height: 100%; transition: height 1.2s linear; }
  .hbtn span { position: relative; }
  .homewrap { display: flex; flex-direction: column; align-items: center; gap: 4px; }
  #holdHint { font-size: 13px; font-weight: 800; opacity: .6; display: none; }
  body.toddler #holdHint { display: block; }
  .mid { display: flex; align-items: center; }
  #stars {
    font-size: clamp(26px, 4vw, 36px); font-weight: 900; background: #ffffffcc;
    padding: 8px 22px; border-radius: 40px; box-shadow: 0 4px 14px #0000001a; display: none;
  }
  body.kids #stars { display: block; }
  #stars.bump { animation: bump .45s ease; }
  @keyframes bump { 40% { transform: scale(1.3); } }
  #target {
    display: none; align-items: center; gap: 10px; font-size: clamp(20px, 3.4vw, 30px); font-weight: 900;
    background: #fff; padding: 6px 20px 6px 14px; border-radius: 40px; box-shadow: 0 4px 14px #0000001a;
  }
  #target.show { display: flex; animation: bump .5s ease; }
  #target .t { font-size: 1.45em; line-height: 1; display: flex; align-items: center; }

  /* ---------- Cheer ---------- */
  #cheer {
    position: fixed; top: 52%; left: 0; right: 0; z-index: 3; pointer-events: none; text-align: center;
    font-size: clamp(44px, 9vw, 96px); font-weight: 900; color: #fff;
    text-shadow: 0 4px 0 #f783ac, 0 8px 24px #0003; opacity: 0;
  }
  #cheer.go { animation: cheer 1.8s ease forwards; }
  @keyframes cheer {
    0% { opacity: 0; transform: scale(.4); }
    20% { opacity: 1; transform: scale(1.12); }
    35% { transform: scale(1); }
    80% { opacity: 1; }
    100% { opacity: 0; transform: translateY(-40px); }
  }

  /* ---------- Topic + language pickers ---------- */
  .screen { position: fixed; inset: 0; z-index: 5; display: none; overflow-y: auto; }
  .screen.show { display: block; }
  #langs { z-index: 7; background: linear-gradient(180deg, #bfe9ff 0%, #e6f7ff 55%, #fff4d6 100%); }
  .screen-inner {
    min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: clamp(12px, 2.4vh, 22px); padding: 72px 16px 24px; text-align: center;
  }
  .screen h2 { font-size: clamp(30px, 5.5vw, 52px); font-weight: 900; line-height: 1.15; }
  .tiles { display: grid; grid-template-columns: repeat(4, minmax(0, 150px)); gap: 14px; }
  @media (max-width: 660px) { .tiles { grid-template-columns: repeat(2, minmax(0, 160px)); } }
  .tile {
    appearance: none; border: 0; border-radius: 24px; background: var(--card); color: var(--ink);
    box-shadow: 0 8px 22px #0000001c; padding: 14px 8px; cursor: pointer; font: inherit;
    display: flex; flex-direction: column; align-items: center; gap: 2px; transition: transform .15s ease;
  }
  .tile:hover, .tile:focus-visible { transform: translateY(-3px) scale(1.03); outline: none; }
  .tile:active { transform: scale(.95); }
  .tile .emoji { font-size: clamp(42px, 7vw, 58px); line-height: 1.15; }
  .tile b { display: block; font-size: 20px; font-weight: 900; }
  .tile small { display: block; font-weight: 800; opacity: .65; }
  .tile .lvl { font-size: 13px; margin-top: 2px; }
  .tile .blurb { font-size: 15px; font-weight: 700; line-height: 1.3; margin-top: 2px; }
  .tile.grow {
    grid-column: 1 / -1; flex-direction: row; justify-content: center; gap: 16px; padding: 16px 22px; text-align: start;
    background: #fff8db; box-shadow: 0 0 0 3px #ffd43b, 0 8px 22px #0000001c;
  }
  .tile.grow b { font-size: 24px; }
  .tile.lang { padding: 22px 8px; }
  .tile.lang b { font-size: 24px; }
  .tile.lang.on { background: #fff8db; box-shadow: 0 0 0 3px #ffd43b, 0 8px 22px #0000001c; }
  .row { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
  .pill {
    appearance: none; border: 0; border-radius: 40px; padding: 12px 22px; cursor: pointer;
    font: inherit; font-size: 18px; font-weight: 800; color: var(--ink);
    background: #ffffffb3; box-shadow: 0 4px 14px #0000001a;
  }
  .pill[aria-pressed="true"] { background: #ffd43b; }
  .hint { font-size: 15px; font-weight: 600; opacity: .65; max-width: 520px; line-height: 1.4; }
  #progress {
    position: fixed; left: 50%; bottom: max(16px, env(safe-area-inset-bottom)); transform: translateX(-50%);
    z-index: 3; pointer-events: none; display: none; align-items: center; gap: 10px;
    background: #ffffffcc; padding: 6px 18px 6px 10px; border-radius: 40px; box-shadow: 0 4px 14px #0000001a;
    font-size: 18px; font-weight: 900;
  }
  #progress.show { display: flex; }
  #progress .lv { font-size: 30px; line-height: 1; }
  #progress .bar { width: clamp(90px, 22vw, 180px); height: 14px; border-radius: 10px; background: #00000014; overflow: hidden; }
  #progress .bar i { display: block; height: 100%; border-radius: 10px; background: linear-gradient(90deg, #8ce99a, #40c057); transition: width .4s ease; }

  /* ---------- Flash card ---------- */
  #flash {
    position: fixed; left: 50%; top: 15%; z-index: 3; pointer-events: none;
    display: flex; flex-direction: column; align-items: center; gap: 2px;
    padding: 14px 30px 16px; border-radius: 32px; background: #ffffffd9;
    box-shadow: 0 10px 30px #0000001f; opacity: 0; max-width: 92vw; transform: translateX(-50%);
  }
  #flash.go { animation: flash 2s ease forwards; }
  @keyframes flash {
    0% { opacity: 0; transform: translateX(-50%) scale(.6); }
    14% { opacity: 1; transform: translateX(-50%) scale(1.06); }
    24% { transform: translateX(-50%) scale(1); }
    78% { opacity: 1; transform: translateX(-50%) scale(1); }
    100% { opacity: 0; transform: translateX(-50%) scale(1); }
  }
  #flash .big { font-size: clamp(64px, 16vmin, 140px); font-weight: 900; line-height: 1.05; display: flex; align-items: center; gap: .18em; direction: ltr; }
  #flash .big small { font-size: .62em; opacity: .55; line-height: 1.05; }
  #flash .big.multi { font-size: clamp(44px, 11vmin, 96px); }
  #flash .extra { font-size: clamp(24px, 5.5vmin, 44px); line-height: 1.2; text-align: center; }
  #flash .word { font-size: clamp(28px, 6vmin, 52px); font-weight: 900; text-align: center; text-shadow: 0 2px 0 #0000001a; }
  :root[lang="ur"] #flash .word { line-height: 1.8; }
  .swatch { width: 1em; height: 1em; border-radius: 50%; display: inline-block; box-shadow: inset 0 -.08em 0 #00000026; }
  #flash svg, #target svg { width: 1em; height: 1em; }

  @media (prefers-reduced-motion: reduce) {
    #cheer.go { animation-duration: 2.4s; }
    .card, .tile { transition: none; }
  }
</style>
</head>
<body>
<canvas id="c" aria-label="Bubble play area"></canvas>

<button class="pill" id="langBtn" aria-label="Language">🌐 English</button>

<div id="menu">
  <h1>Bubble Garden</h1>
  <p data-i18n="tagline">Tap the bubbles. Every bubble sings.</p>
  <div class="cards">
    <button class="card" data-mode="toddler">
      <span class="emoji">🐣</span>
      <span><b data-i18n="toddler">Little Ones</b><br><small data-i18n="toddlerSub"></small></span>
    </button>
    <button class="card" data-mode="kids">
      <span class="emoji">🎈</span>
      <span><b data-i18n="play">Play</b><br><small data-i18n="playSub"></small></span>
    </button>
  </div>
</div>

<div id="hud">
  <div class="homewrap">
    <button class="hbtn" id="home" aria-label="Back to menu"><span class="fill"></span><span>🏠</span></button>
    <div id="holdHint" data-i18n="hold">hold</div>
  </div>
  <div class="mid">
    <div id="stars" aria-live="polite">⭐ 0</div>
    <div id="target" aria-live="polite"></div>
  </div>
  <button class="hbtn" id="sound" aria-label="Sound on/off"><span>🔊</span></button>
</div>

<div id="cheer" aria-live="polite"></div>
<div id="flash" aria-live="polite"></div>
<div id="progress" aria-label="Learning level"></div>

<div id="topics" class="screen">
  <div class="screen-inner">
    <h2 id="learnTitle">What shall we learn? 🐣</h2>
    <div class="tiles" id="tiles"></div>
    <div class="row">
      <button class="pill" id="findToggle" aria-pressed="false"></button>
      <button class="pill" id="resetProgress"></button>
      <button class="pill" id="backMain"></button>
    </div>
    <p class="hint" data-i18n="hint"></p>
  </div>
</div>

<div id="langs" class="screen">
  <div class="screen-inner">
    <h2>🌐 <span data-i18n="language">Language</span></h2>
    <div class="tiles" id="langGrid"></div>
    <p class="hint" id="voiceNote"></p>
  </div>
</div>

<script src="i18n.js"></script>
<script>
(() => {
  const $ = s => document.querySelector(s);
  const canvas = $('#c'), ctx = canvas.getContext('2d');
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const rand = (a, b) => a + Math.random() * (b - a);
  const pick = a => a[Math.random() * a.length | 0];
  const fmt = (s, vars) => s.replace(/\{(\w)\}/g, (_, k) => vars[k]);

  // ---------- Layout ----------
  let W = 0, H = 0, S = 1;
  function resize() {
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    W = innerWidth; H = innerHeight;
    canvas.width = W * dpr; canvas.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    S = Math.max(.6, Math.min(1.4, Math.min(W, H) / 700));
  }
  addEventListener('resize', resize); resize();

  // ---------- Language ----------
  const LANGS = window.BG_LANGS, EN = LANGS.en;
  let lang = '';
  try { lang = localStorage.getItem('bg-lang') || ''; } catch (e) {}
  if (!LANGS[lang]) {
    const nav = (navigator.language || 'en').slice(0, 2).toLowerCase();
    lang = LANGS[nav] ? nav : 'en';
  }
  let LANG = LANGS[lang];
  const ui = k => LANG.ui[k] ?? EN.ui[k];
  // Translated word for item #i of a category; "Name|find form" (see i18n.js)
  function words(cat, i) {
    const raw = (LANG.words[cat] || [])[i] || EN.words[cat][i];
    const [name, find] = raw.split('|');
    const fallbackFind = LANG.autoFind ? LANG.autoFind(name) : name;
    return { name, find: find || fallbackFind };
  }

  // ---------- Data ----------
  // Orders here must match the word lists in i18n.js
  const COLOUR_HEX = ['#ff6b6b', '#ffa94d', '#fcc419', '#51cf66', '#4dabf7', '#9775fa', '#f783ac', '#b07d52'];
  const COLORS = COLOUR_HEX.slice(0, 7).map((hex, i) => ({ hex, i })); // bubble colours (no brown)
  const EMOJI = {
    animals: ['🐶', '🐱', '🐮', '🦆', '🐑', '🐸', '🦁', '🐔', '🐝', '🐵', '🐘', '🐰'],
    fruits: ['🍎', '🍌', '🥭', '🍇', '🍓', '🍉', '🍊', '🍒', '🍍', '🍐'],
    vehicles: ['🚗', '🚌', '🚂', '✈️', '🚒', '🚑', '⛵', '🚲', '🚜', '🚁', '🚀']
  };
  const MODES = {
    menu:    { spawnEvery: 1.1, max: 9,  size: [28, 58],  speed: [25, 45] },
    toddler: { spawnEvery: 1.1, max: 6,  size: [72, 100], speed: [28, 48] },
    kids:    { spawnEvery: .6,  max: 12, size: [46, 74],  speed: [50, 95] }
  };

  // ---------- Little Ones: learning topics ----------
  const LEVEL_POPS = 12; // pops needed to unlock the next stage
  const COUNTERS = ['🐥', '⭐', '🍎', '🎈', '🐟', '🌸', '🚗'];
  const GROWTH = ['🌱', '🌿', '🌷', '🌼', '🌻', '🌳', '🌈', '🏆'];
  // ABC teaches the English alphabet in every language
  const LETTERS = [
    ['A', 'Apple', '🍎'], ['B', 'Ball', '⚽'], ['C', 'Cat', '🐱'], ['D', 'Dog', '🐶'], ['E', 'Elephant', '🐘'],
    ['F', 'Fish', '🐟'], ['G', 'Grapes', '🍇'], ['H', 'House', '🏠'], ['I', 'Ice cream', '🍦'], ['J', 'Juice', '🧃'],
    ['K', 'Kite', '🪁'], ['L', 'Lion', '🦁'], ['M', 'Moon', '🌙'], ['N', 'Nose', '👃'], ['O', 'Orange', '🍊'],
    ['P', 'Pig', '🐷'], ['Q', 'Queen', '👑'], ['R', 'Rainbow', '🌈'], ['S', 'Sun', '☀️'], ['T', 'Tree', '🌳'],
    ['U', 'Umbrella', '☂️'], ['V', 'Van', '🚐'], ['W', 'Whale', '🐳'], ['X', 'Xylophone', '🎶'], ['Y', 'Yo-yo', '🪀'],
    ['Z', 'Zebra', '🦓']
  ];
  const starD = (() => {
    let d = '';
    for (let i = 0; i < 10; i++) {
      const a = i * Math.PI / 5 - Math.PI / 2, r = i % 2 ? 19 : 46;
      d += (i ? 'L' : 'M') + (Math.cos(a) * r).toFixed(1) + ',' + (Math.sin(a) * r + 4).toFixed(1);
    }
    return d + 'Z';
  })();
  // Shapes are SVG paths in a -50..50 box: drawn on canvas via Path2D and in cards via <svg>
  const SHAPES = [
    ['circle', 'M-40,0a40,40 0 1,0 80,0a40,40 0 1,0 -80,0'],
    ['square', 'M-36,-36H36V36H-36Z'],
    ['triangle', 'M0,-46L48,30H-48Z'],
    ['star', starD],
    ['heart', 'M0,38C-62,-4 -32,-52 0,-20C32,-52 62,-4 0,38Z'],
    ['diamond', 'M0,-46L34,0L0,46L-34,0Z'],
    ['rectangle', 'M-46,-27H46V27H-46Z'],
    ['oval', 'M-46,0a46,29 0 1,0 92,0a46,29 0 1,0 -92,0']
  ];
  const SHAPE_PATHS = Object.fromEntries(SHAPES.map(([id, d]) => [id, new Path2D(d)]));
  const SHAPE_D = Object.fromEntries(SHAPES);
  const shapeSVG = (id, color) => `<svg viewBox="-50 -50 100 100" aria-hidden="true"><path d="${SHAPE_D[id]}" fill="${color}"/></svg>`;

  const emojiItems = cat => EMOJI[cat].map((e, idx) => ({ kind: 'emoji', cat, idx, label: e }));
  const ANIMAL_ITEMS = emojiItems('animals');
  const FRUIT_ITEMS = emojiItems('fruits');
  const VEHICLE_ITEMS = emojiItems('vehicles');
  const NUMBER_ITEMS = Array.from({ length: 10 }, (_, idx) => ({ kind: 'text', cat: 'numbers', idx, label: String(idx + 1), count: idx + 1, key: String((idx + 1) % 10) }));
  const SHAPE_ITEMS = SHAPES.map(([shape], idx) => ({ kind: 'shape', cat: 'shapes', idx, shape }));
  const COLOUR_ITEMS = COLOUR_HEX.map((color, idx) => ({ kind: 'colour', cat: 'colours', idx, color }));
  const LETTER_ITEMS = LETTERS.map(([L, word, emoji]) => ({ kind: 'text', cat: 'letters', label: L, word, emoji, key: L.toLowerCase() }));
  const colours = (...idx) => idx.map(i => COLOUR_ITEMS[i]);

  const nameOf = it => it.cat === 'letters' ? it.label : words(it.cat, it.idx).name;
  const findOf = it => it.cat === 'letters' ? (lang === 'en' ? `the letter ${it.label}` : it.label) : words(it.cat, it.idx).find;
  const nativeNumeral = n => LANG.digits ? String(n).replace(/\d/g, d => LANG.digits[d]) : '';

  // Stages are cumulative; `fresh` is what a stage adds (shown more often right after unlocking)
  const stages = list => {
    let acc = [];
    return list.map(add => { acc = acc.concat(add); return { items: acc, fresh: add }; });
  };
  const TOPICS = [
    { id: 'grow', icon: '🌱', key: 'grow', blurb: 'growBlurb', stages: stages([
      ANIMAL_ITEMS,
      SHAPE_ITEMS.slice(0, 3),
      NUMBER_ITEMS.slice(0, 3),
      colours(0, 4, 2),
      [...SHAPE_ITEMS.slice(3, 5), ...NUMBER_ITEMS.slice(3, 5)],
      [...FRUIT_ITEMS, ...VEHICLE_ITEMS],
      [...NUMBER_ITEMS.slice(5), ...SHAPE_ITEMS.slice(5), ...colours(3, 1, 5, 6, 7)],
      LETTER_ITEMS
    ]) },
    { id: 'animals', icon: '🐶', key: 'animals', stages: stages([ANIMAL_ITEMS]) },
    { id: 'numbers', icon: '🔢', key: 'numbers', stages: stages([NUMBER_ITEMS.slice(0, 3), NUMBER_ITEMS.slice(3, 5), NUMBER_ITEMS.slice(5)]) },
    { id: 'shapes', icon: '🔷', key: 'shapes', stages: stages([SHAPE_ITEMS.slice(0, 3), SHAPE_ITEMS.slice(3, 5), SHAPE_ITEMS.slice(5)]) },
    { id: 'letters', icon: '🔤', key: 'abc', stages: stages([LETTER_ITEMS.slice(0, 5), LETTER_ITEMS.slice(5, 10), LETTER_ITEMS.slice(10, 18), LETTER_ITEMS.slice(18)]) },
    { id: 'colours', icon: '🎨', key: 'colours', stages: stages([colours(0, 4, 2), colours(3, 1, 5), colours(6, 7)]) },
    { id: 'fruits', icon: '🍎', key: 'fruits', stages: stages([FRUIT_ITEMS]) },
    { id: 'vehicles', icon: '🚗', key: 'vehicles', stages: stages([VEHICLE_ITEMS]) },
    { id: 'mix', icon: '🎁', key: 'mix', stages: stages([[...ANIMAL_ITEMS, ...NUMBER_ITEMS, ...SHAPE_ITEMS, ...COLOUR_ITEMS, ...FRUIT_ITEMS, ...VEHICLE_ITEMS, ...LETTER_ITEMS]]) }
  ];

  let progress = {};
  try { progress = JSON.parse(localStorage.getItem('bg-progress') || '{}') || {}; } catch (e) {}
  const saveProgress = () => { try { localStorage.setItem('bg-progress', JSON.stringify(progress)); } catch (e) {} };
  const levelOf = t => Math.min(t.stages.length - 1, Math.floor((progress[t.id] || 0) / LEVEL_POPS));
  let topic = TOPICS[0], freshUntil = 0;
  const stageNow = () => topic.stages[levelOf(topic)];
  const allItems = () => topic.stages[topic.stages.length - 1].items;
  function pickItem() {
    const s = stageNow();
    return pops < freshUntil && Math.random() < .5 ? pick(s.fresh) : pick(s.items);
  }

  let findOn = false, target = null, targetAt = 0, nagT = null;
  try { findOn = localStorage.getItem('bg-find') === '1'; } catch (e) {}

  // ---------- Audio (all synthesized, no files) ----------
  let ac = null, master = null, wetBus = null, muted = false;
  try { muted = localStorage.getItem('bg-muted') === '1'; } catch (e) {}
  const PENTA = [1, 9 / 8, 5 / 4, 3 / 2, 5 / 3]; // major pentatonic: every note sounds good together
  const penta = (i, base) => base * PENTA[((i % 5) + 5) % 5] * Math.pow(2, Math.floor(i / 5));

  function initAudio() {
    if (!ac) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      ac = new AC();
      const comp = ac.createDynamicsCompressor(); comp.connect(ac.destination);
      master = ac.createGain(); master.gain.value = muted ? 0 : .9; master.connect(comp);
      const conv = ac.createConvolver(); conv.buffer = impulse(2.8);

  function impulse(sec) {

    for (let c = 0; c < 2; c++) {

    }
    return b;
  }
  function tone(freq, { type = 'sine', dur = .8, vol = .25, attack = .008, wet = .5, when = 0 } = {}) {
    if (!ac || muted) return;
    const t = ac.currentTime + when, o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    g.gain.setValueAtTime(.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + attack);
    g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    o.connect(g); g.connect(master);

    o.start(t); o.stop(t + dur + .05);
  }
  function bell(freq, vol = .22, dur = 1.6, wet = .6, when = 0) {
    tone(freq, { dur, vol, wet, when });
    tone(freq * 2, { dur: dur * .5, vol: vol * .25, wet, when });
    tone(freq * 3.01, { dur: dur * .25, vol: vol * .1, wet, when });
  }
  function bloop(vol = .28) {
    if (!ac || muted) return;
    const t = ac.currentTime, o = ac.createOscillator(), g = ac.createGain();
    o.type = 'sine';
    o.frequency.setValueAtTime(900, t); o.frequency.exponentialRampToValueAtTime(220, t + .12);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + .16);
    o.connect(g); g.connect(master); o.start(t); o.stop(t + .2);
  }
  function boing() {
    if (!ac || muted) return;
    const t = ac.currentTime, o = ac.createOscillator(), g = ac.createGain();
    o.type = 'triangle';
    o.frequency.setValueAtTime(160, t);
    o.frequency.exponentialRampToValueAtTime(520, t + .08);
    o.frequency.exponentialRampToValueAtTime(240, t + .35);
    g.gain.setValueAtTime(.22, t); g.gain.exponentialRampToValueAtTime(.0001, t + .4);
    o.connect(g); g.connect(master); o.start(t); o.stop(t + .45);

  function fanfare(base = 261.63) {
    [0, 2, 4, 5, 7, 10].forEach((i, n) => bell(penta(i, base), .2, 1.2, .4, n * .1));
  }

  // ---------- Voice ----------
  const canSpeak = 'speechSynthesis' in window;
  let voices = [], lastSpeak = 0;
  function loadVoices() { if (canSpeak) voices = speechSynthesis.getVoices(); }
  if (canSpeak) {
    loadVoices();
    speechSynthesis.onvoiceschanged = () => { loadVoices(); if ($('#langs').classList.contains('show')) renderLangs(); };
  }
  function voiceFor(tts) {
    const want = tts.toLowerCase(), base = want.split('-')[0];
    const norm = v => v.lang.replace('_', '-').toLowerCase();
    return voices.find(v => norm(v) === want) || voices.find(v => norm(v).split('-')[0] === base) || null;
  }
  const hasVoice = code => !canSpeak ? false : !voices.length || !!voiceFor(LANGS[code].tts);
  function speak(text, { force = false, tts = LANG.tts } = {}) {
    if (muted || !canSpeak) return;
    const voice = voiceFor(tts);
    if (voices.length && !voice) return; // no voice for this language: the words still show on screen
    const now = performance.now();
    if (!force && now - lastSpeak < 650) return;
    lastSpeak = now;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = tts; if (voice) u.voice = voice;
    u.pitch = 1.3; u.rate = .9;

  }
  // Letters are always said with an English voice
  const sayItem = (it, opts = {}) => it.cat === 'letters' ? speak(it.label, { ...opts, tts: EN.tts }) : speak(nameOf(it), opts);

  // ---------- State ----------
  let mode = 'menu', running = false, time = 0, spawnT = 0;
  let bubbles = [], parts = [], rings = [];
  let stars = 0, nextGoal = 10, pops = 0;
  const timers = [];

  function spawn(prefill = false, forced = null) {
    const m = MODES[mode];
    if (!forced && bubbles.length >= m.max) return;
    const r = rand(...m.size) * S, sway = rand(10, 28) * S;
    const lo = r + sway, hi = Math.max(lo, W - r - sway);
    const b = {
      x0: rand(lo, hi), x: 0, y: prefill ? rand(H * .35, H * .95) : H + r + 10, r, sway,
      vy: rand(...m.speed) * S * (reduceMotion ? .6 : 1),
      ph: rand(0, 6.28), fr: rand(.4, .9), wob: rand(0, 6.28), born: time
    };
    if (mode === 'toddler') {
      const it = forced || (findOn && target && Math.random() < .35 ? target : pickItem());
      Object.assign(b, { item: it, color: it.kind === 'colour' ? it.color : pick(COLORS).hex, label: it.kind === 'emoji' ? it.label : null });
    } else if (mode === 'kids') {
      if (Math.random() < .08) Object.assign(b, { color: '#fcc419', gold: true, label: '⭐' });
      else { const c = pick(COLORS); Object.assign(b, { color: c.hex, cidx: c.i }); }
    } else {
      b.color = pick(COLORS).hex;
    }
    bubbles.push(b);
  }

  // ---------- Effects ----------
  function burst(x, y, color, n, { speed = 220, grav = 300, life = .8, size = 7, star = false } = {}) {
    if (reduceMotion) n = Math.ceil(n / 2);
    for (let i = 0; i < n; i++) {
      const a = rand(0, Math.PI * 2), s = rand(.35, 1) * speed * S, l = rand(.5, 1) * life;
      parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, g: grav, life: l, max: l,
        size: rand(.5, 1) * size * S, color, star: star && Math.random() < .5, rot: rand(0, 6), vr: rand(-6, 6) });
    }
  }
  function confetti(n = 70) {
    if (reduceMotion) n = 25;
    for (let i = 0; i < n; i++) {
      const l = rand(1.8, 3);
      parts.push({ x: rand(0, W), y: rand(-60, -10), vx: rand(-40, 40), vy: rand(80, 200), g: 60, life: l, max: l,
        size: rand(6, 11) * S, color: pick(COLORS).hex, rect: true, rot: rand(0, 6), vr: rand(-8, 8) });
    }
  }
  function ripple(x, y, color) {
    rings.push({ x, y, r: 6, speed: 140 * S, life: 1, max: 1, color });
  }
  function cheer(text) {
    const el = $('#cheer');
    el.textContent = text; el.classList.remove('go'); void el.offsetWidth; el.classList.add('go');
  }

  // ---------- Learning cards, progress, find-it ----------
  function itemIcon(it, color) {
    if (it.kind === 'shape') return shapeSVG(it.shape, color || '#4dabf7');
    if (it.kind === 'colour') return `<span class="swatch" style="background:${it.color}"></span>`;
    return it.label;
  }
  function flashHTML(html) {
    const el = $('#flash');
    el.innerHTML = html; el.classList.remove('go'); void el.offsetWidth; el.classList.add('go');
  }
  function showFlash(it, color) {
    let big = itemIcon(it, color), extra = '', word = nameOf(it), style = '';
    if (it.count) {
      // the quantity too: 3 → 🐥🐥🐥, plus the language's own numeral (۳, 三, ३ …)
      const native = nativeNumeral(it.count);
      if (native) big += `<small>${native}</small>`;
      const c = pick(COUNTERS);
      extra = Array.from({ length: it.count }, (_, i) => c + ((i + 1) % 5 === 0 && i + 1 < it.count ? '<br>' : '')).join('');
    } else if (it.cat === 'letters') {
      big = `${it.label}<small>${it.label.toLowerCase()}</small>${it.emoji}`;
      word = `${it.label} is for ${it.word}`;
    } else if (it.kind === 'colour') {
      style = ` style="color:${it.color}"`;
    }
    flashHTML(`<div class="big">${big}</div>${extra ? `<div class="extra">${extra}</div>` : ''}<div class="word"${style}>${word}</div>`);
  }
  function renderProgress() {
    const el = $('#progress');
    if (mode !== 'toddler' || topic.stages.length < 2) { el.classList.remove('show'); return; }
    const lv = levelOf(topic), max = topic.stages.length - 1, p = progress[topic.id] || 0;
    const pct = lv >= max ? 100 : (p % LEVEL_POPS) / LEVEL_POPS * 100;
    el.innerHTML = `<span class="lv">${lv >= max ? '🏆' : GROWTH[Math.min(lv, GROWTH.length - 1)]}</span>` +
      `<span class="bar"><i style="width:${pct}%"></i></span><span>${lv + 1}/${max + 1}</span>`;
    el.classList.add('show');
  }
  // Returns true when this pop unlocked a new stage
  function learnTick() {
    if (topic.stages.length < 2) return false;
    const before = levelOf(topic);
    progress[topic.id] = (progress[topic.id] || 0) + 1;
    saveProgress();
    const after = levelOf(topic);
    renderProgress();
    if (after === before) return false;
    const stage = topic.stages[after], shown = stage.fresh.slice(0, 4);
    freshUntil = pops + 12;
    timers.push(setTimeout(() => {
      confetti(); fanfare(392); cheer('🌟');
      flashHTML(`<div class="big multi">${shown.map(it => itemIcon(it, pick(COLORS).hex)).join('')}</div><div class="word">${ui('fresh')}</div>`);
      speak(`${ui('wellDone')} ${shown.map(nameOf).join(', ')}`, { force: true });
      stage.fresh.slice(0, 3).forEach((it, i) => timers.push(setTimeout(() => spawn(false, it), 700 + i * 600)));
    }, 900));
    return true;
  }
  function renderTarget() {
    const el = $('#target');
    el.innerHTML = `🎯 <span class="t">${itemIcon(target)}</span>`;
    el.classList.remove('show'); void el.offsetWidth; el.classList.add('show');
  }
  const askFind = () => speak(fmt(ui('find'), { w: findOf(target) }), { force: true });

    if (mode !== 'toddler' || !findOn) return;
    const visible = bubbles.filter(b => b.item && b.y < H - b.r && b.y > b.r).map(b => b.item);
    target = pick(visible.length ? visible : stageNow().items);
    targetAt = time;

    renderTarget();
    askFind();

    }, 10000);
  }
  function found(it) {
    target = null; clearInterval(nagT);
    $('#target').classList.remove('show');
    confetti(45); fanfare(); cheer('🎉');
    speak(fmt(ui('found'), { w: findOf(it) }), { force: true });
    timers.push(setTimeout(newTarget, 3500));
  }

  function setStars() {
    const el = $('#stars');
    el.textContent = `⭐ ${stars}`;
    el.classList.remove('bump'); void el.offsetWidth; el.classList.add('bump');
  }

  // ---------- Popping ----------
  function pop(b, i) {
    if (i >= 0) bubbles.splice(i, 1);
    const idx = Math.round((b.x / W) * 9); // left = low notes, right = high notes
    pops++;

      const it = b.item;
      bell(penta(idx, 261.63), .18, 1.2, .4);

      timers.push(setTimeout(() => speak(`${ui('yay')} ${goal}!`, { force: true }), 250));
    }
  }

  function hitAt(x, y) {
    for (let i = bubbles.length - 1; i >= 0; i--) {

    return false;
  }

  function emptyTap(x, y) {
    bell(penta(Math.round((1 - y / H) * 9), 261.63), .1, .8, .4);

    burst(x, y, pick(COLORS).hex, 8, { speed: 140, grav: 200, life: .6, size: 6 });
  }

  // ---------- Input ----------
  const pointers = new Map();
  canvas.addEventListener('pointerdown', e => {
    if (!running) return;
    initAudio();
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY, t: 0 });
    if (!hitAt(e.clientX, e.clientY)) emptyTap(e.clientX, e.clientY);
  });

    const p = pointers.get(e.pointerId);
    if (!p || !running) return;
    const x = e.clientX, y = e.clientY;
    // a glowing trail and wind-chime notes while dragging
    parts.push({ x, y, vx: rand(-15, 15), vy: rand(-15, 15), g: 0, life: .7, max: .7, size: 7 * S, color: pick(COLORS).hex, rot: 0, vr: 0 });
    hitAt(x, y);
    const now = performance.now();
    if (now - p.t > 150 && Math.hypot(x - p.x, y - p.y) > 24) {

  canvas.addEventListener('pointerup', endPointer);
  canvas.addEventListener('pointercancel', endPointer);
  canvas.addEventListener('pointerleave', endPointer);
  addEventListener('contextmenu', e => e.preventDefault());
  document.addEventListener('gesturestart', e => e.preventDefault());

  // Keyboard mashing (toddlers on laptops): any key pops something
  addEventListener('keydown', e => {

    initAudio();
    if (mode === 'toddler') {
      // typing a letter or number shows that one
      const k = e.key.toLowerCase(), it = allItems().find(x => x.key === k);

        if (i >= 0) pop(bubbles[i], i);
        else pop({ x: rand(W * .2, W * .8), y: rand(H * .35, H * .8), r: 60 * S, item: it, color: pick(COLORS).hex }, -1);
        return;
      }
    }
    if (bubbles.length) { const i = bubbles.length * Math.random() | 0; pop(bubbles[i], i); }
    else emptyTap(rand(W * .2, W * .8), rand(H * .3, H * .8));
  });

  // ---------- Mode switching ----------
  function start(m, topicId) {
    initAudio();
    mode = m; running = true; time = 0; spawnT = 0;
    bubbles = []; parts = []; rings = []; stars = 0; nextGoal = 10; pops = 0;
    target = null;
    document.body.className = m;

    $('#topics').classList.remove('show');

      if (findOn) timers.push(setTimeout(newTarget, 3200));

  // ---------- Topic picker ----------

      const blurb = t.blurb ? `<small class="blurb">${ui(t.blurb)}</small>` : '';
      return `<button class="tile${t.id === 'grow' ? ' grow' : ''}" data-topic="${t.id}"><span class="emoji">${t.icon}</span><span><b>${ui(t.key)}</b>${blurb}${level}</span></button>`;
    }).join('');
  }

  });
  $('#backMain').addEventListener('click', () => {
    $('#topics').classList.remove('show');
    $('#menu').classList.remove('hide');
  });
  $('#resetProgress').addEventListener('click', () => {
    if (!confirm(ui('resetConfirm'))) return;
    progress = {}; saveProgress(); renderTiles();
  });

  // ---------- Language picker ----------
  function applyLang() {
    document.documentElement.lang = lang;
    document.documentElement.dir = LANG.dir;
    document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = ui(el.dataset.i18n); });
    $('#langBtn').textContent = `🌐 ${LANG.name}`;
    $('#learnTitle').textContent = `${ui('learnTitle')} 🐣`;
    $('#backMain').textContent = `${LANG.dir === 'rtl' ? '→' : '←'} ${ui('back')}`;

      `<b>${l.name}</b>${hasVoice(code) ? '' : '<small>🔇</small>'}</button>`).join('');

  }
  $('#langBtn').addEventListener('click', () => { renderLangs(); $('#langs').classList.add('show'); });
  $('#langGrid').addEventListener('click', e => {
    const t = e.target.closest('.tile');

  });

  document.querySelectorAll('.card').forEach(c => c.addEventListener('click', () => {
    if (c.dataset.mode === 'toddler') { initAudio(); showTopics(); } else start(c.dataset.mode);
  }));

  // Home: one tap normally, press-and-hold in toddler mode so little hands don't exit by accident
  const home = $('#home'); let holdT = null;
  home.addEventListener('pointerdown', e => {
    e.stopPropagation();
    if (mode !== 'toddler') { goHome(); return; }
    home.classList.add('holding');
    holdT = setTimeout(() => { home.classList.remove('holding'); goHome(); }, 1200);

  ['pointerup', 'pointerleave', 'pointercancel'].forEach(ev => home.addEventListener(ev, () => { clearTimeout(holdT); home.classList.remove('holding'); }));
  home.addEventListener('click', e => { if (e.detail === 0) goHome(); }); // keyboard

  function applyMute() {
    $('#sound span').textContent = muted ? '🔇' : '🔊';
    if (master) master.gain.value = muted ? 0 : .9;
    if (muted && canSpeak) speechSynthesis.cancel();
    try { localStorage.setItem('bg-muted', muted ? '1' : '0'); } catch (e) {}
  }

  applyMute();
  applyLang();

  document.addEventListener('visibilitychange', () => {
    if (!ac) return;
    document.hidden ? ac.suspend() : ac.resume();
  });

  // ---------- Loop ----------
  function update(dt) {
    time += dt;
    const m = MODES[mode];
    spawnT -= dt;
    if (spawnT <= 0) { spawn(); spawnT = m.spawnEvery * rand(.7, 1.3); }
    for (const b of bubbles) { b.y -= b.vy * dt; b.x = b.x0 + Math.sin(time * b.fr + b.ph) * b.sway; }
    bubbles = bubbles.filter(b => b.y > -b.r - 20); // floating away is fine, nothing is ever "lost"
    for (const p of parts) { p.vy += p.g * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.vr * dt; p.life -= dt; }
    parts = parts.filter(p => p.life > 0);
    for (const r of rings) { r.r += r.speed * dt; r.life -= dt; }
    rings = rings.filter(r => r.life > 0);
  }

  function starPath(r) {
    ctx.beginPath();
    for (let i = 0; i < 10; i++) {
      const a = i * Math.PI / 5 - Math.PI / 2, rr = i % 2 ? r * .45 : r;
      ctx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr);
    }
    ctx.closePath();
  }

  function drawBubble(b) {
    const w = 1 + Math.sin(time * 3 + b.wob) * .035, rx = b.r * w, ry = b.r / w;
    ctx.save();
    ctx.translate(b.x, b.y);
    ctx.globalAlpha = Math.min(1, (time - b.born) / .6 + (b.born === 0 ? 1 : 0));
    const it = b.item;
    const hint = target && it === target && time - targetAt > 5; // glow helps after a few seconds
    if (b.gold || hint) {
      ctx.shadowColor = hint ? '#fff3a0' : b.color;
      ctx.shadowBlur = hint ? 28 + Math.sin(time * 5) * 14 : 30;
    }
    const solid = it && it.kind === 'colour';
    const g = ctx.createRadialGradient(-rx * .3, -ry * .35, b.r * .1, 0, 0, b.r);
    g.addColorStop(0, solid ? '#ffffffaa' : '#ffffffee');
    g.addColorStop(.4, b.color + (solid ? 'f2' : 'cc'));
    g.addColorStop(1, b.color + (solid ? 'dd' : '88'));
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.ellipse(0, 0, rx, ry, 0, 0, Math.PI * 2); ctx.fill();
    ctx.shadowBlur = 0;
    ctx.lineWidth = 2; ctx.strokeStyle = '#ffffffaa'; ctx.stroke();
    ctx.fillStyle = '#ffffffb5';
    ctx.beginPath(); ctx.ellipse(-rx * .38, -ry * .42, rx * .2, ry * .11, -.6, 0, Math.PI * 2); ctx.fill();
    if (it && it.kind === 'text') {
      const fs = Math.round(b.r * (it.label.length > 1 ? .9 : 1.1));
      ctx.font = `900 ${fs}px Nunito, ui-rounded, system-ui, sans-serif`;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.lineJoin = 'round';
      ctx.lineWidth = Math.max(3, b.r * .1); ctx.strokeStyle = '#00000038';
      ctx.strokeText(it.label, 0, b.r * .08);
      ctx.fillStyle = '#fff'; ctx.fillText(it.label, 0, b.r * .08);
    } else if (it && it.kind === 'shape') {
      const k = b.r / 66;
      ctx.scale(k, k);
      ctx.shadowColor = '#00000040'; ctx.shadowBlur = 6; ctx.fillStyle = '#fff';
      ctx.fill(SHAPE_PATHS[it.shape]);
    } else if (b.label) {
      ctx.font = `${Math.round(b.r * .95)}px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif`;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(b.label, 0, b.r * .06);
    }
    ctx.restore();
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);
    for (const r of rings) {
      ctx.globalAlpha = Math.max(0, r.life / r.max) * .7;
      ctx.strokeStyle = r.color; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(r.x, r.y, r.r, 0, Math.PI * 2); ctx.stroke();
    }
    ctx.globalAlpha = 1;
    for (const b of bubbles) drawBubble(b);
    for (const p of parts) {
      ctx.save();
      ctx.globalAlpha = Math.max(0, p.life / p.max);
      ctx.fillStyle = p.color;
      ctx.translate(p.x, p.y); ctx.rotate(p.rot);
      if (p.rect) ctx.fillRect(-p.size / 2, -p.size / 4, p.size, p.size / 2);
      else if (p.star) { starPath(p.size); ctx.fill(); }
      else { ctx.beginPath(); ctx.arc(0, 0, p.size / 2, 0, Math.PI * 2); ctx.fill(); }
      ctx.restore();
    }
  }

  let last = performance.now();
  function frame(now) {
    const dt = Math.min(.05, (now - last) / 1000); last = now;
    update(dt); draw();
    requestAnimationFrame(frame);
  }
  for (let i = 0; i < 5; i++) spawn(true);
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
